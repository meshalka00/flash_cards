<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartei</title>
<link rel="manifest" href="./app.webmanifest">
<meta name="theme-color" content="#E6E7E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kartei">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --paper:#E6E7E2;
  --card:#FBFAF7;
  --ink:#1B1D1E;
  --muted:#6B6F69;
  --rule:#C9CCC3;
  --der:#2F5FD0;
  --die:#C0392B;
  --das:#2E7D5B;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 20px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.01em;margin:0}
h1 em{font-style:normal;color:var(--die)}
.counts{font-family:var(--mono);font-size:12px;color:#5E635C;letter-spacing:.02em}

/* Karteikasten: five compartments, the signature element */
.kasten{display:flex;gap:5px;margin:16px 0 10px}
.fach{flex:1;position:relative;height:44px;border:1px solid var(--rule);border-radius:3px;background:#DFE0DA;overflow:hidden}
.fach .fill{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);transition:height .35s ease}
.fach .n{position:absolute;inset:auto 0 3px 0;text-align:center;font-family:var(--mono);font-size:11px;color:#5E635C}
.fach .lbl{position:absolute;top:3px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;color:#8A8E86}
.fach.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 0}

.card{
  position:relative;background:var(--card);border:1px solid var(--rule);border-radius:6px;
  min-height:250px;padding:28px 22px 22px;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.05), 0 10px 24px -18px rgba(0,0,0,.5);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background-image:repeating-linear-gradient(to bottom,transparent,transparent 31px,#EEEDE7 31px,#EEEDE7 32px);
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:6px 0 0 6px;background:#B9BCB4}
.card[data-art="der"]::before{background:var(--der)}
.card[data-art="die"]::before{background:var(--die)}
.card[data-art="das"]::before{background:var(--das)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.term{font-family:var(--serif);font-size:30px;line-height:1.25;font-weight:600}
.term .art{color:#7A7E77;font-weight:500}
.card[data-art="der"] .art{color:var(--der)}
.card[data-art="die"] .art{color:var(--die)}
.card[data-art="das"] .art{color:var(--das)}
.answer{font-size:21px;line-height:1.35;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);width:100%}
.hint{font-family:var(--mono);font-size:12px;color:#6B6F69;margin-top:10px;line-height:1.5}
.tap{position:absolute;bottom:10px;left:0;right:0;font-family:var(--mono);font-size:10px;color:#9A9E96;letter-spacing:.06em}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer}
.btn{
  border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);
  padding:14px 10px;font-size:15px;font-weight:500;transition:background .15s,color .15s;
}
.btn:active{background:var(--ink);color:var(--card)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.solid{background:var(--ink);color:var(--card)}
.btn.quiet{border-color:var(--rule);color:#5E635C}
.btn[disabled]{opacity:.4;cursor:default}

.bar{display:flex;gap:10px;margin-top:16px}
.bar .btn{flex:1;padding:11px 8px;font-size:13px}

.state{text-align:center;padding:30px 6px}
.state h2{font-family:var(--serif);font-size:24px;margin:0 0 8px}
.state p{color:#5E635C;font-size:15px;line-height:1.5;margin:0 auto 20px;max-width:34ch}

/* import sheet */
dialog{
  border:none;border-radius:10px 10px 0 0;padding:0;width:100%;max-width:560px;
  margin:auto auto 0;background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(20,22,20,.45)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--serif);font-size:20px;margin:0 0 6px}
.sheet p{font-size:13px;color:#5E635C;line-height:1.5;margin:0 0 12px}
textarea{
  width:100%;min-height:170px;border:1px solid var(--rule);border-radius:4px;padding:10px;
  font-family:var(--mono);font-size:13px;line-height:1.6;background:#fff;color:var(--ink);resize:vertical;
}
textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0}
label{font-size:13px;color:#5E635C}
select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.note{font-family:var(--mono);font-size:12px;color:#5E635C;min-height:18px}
.danger{color:var(--die);border-color:rgba(192,57,43,.4)}
.sheet .bar{margin-top:14px}
.mini{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.mini .btn{flex:1;padding:9px 6px;font-size:12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Kart<em>ei</em></h1>
    <div class="counts" id="counts"></div>
  </header>

  <div class="kasten" id="kasten" aria-hidden="true"></div>

  <main id="main"></main>

  <div class="bar">
    <button class="btn quiet" id="openImport">Добавить слова</button>
    <button class="btn quiet" id="openAll">Учить все</button>
  </div>
</div>

<dialog id="sheet">
  <div class="sheet">
    <h2>Добавить слова</h2>
    <p>Вставьте список: слово, разделитель, перевод — по одной паре в строке. После перевода можно добавить « | разбор ».</p>
    <textarea id="paste" placeholder="der Rundfunk = радиовещание | Rund + Funk
die Sendung = передача | senden + -ung"></textarea>
    <div class="row">
      <label for="sep">Разделитель</label>
      <select id="sep">
        <option value="auto">Определить сам</option>
        <option value="&#9;">Табуляция</option>
        <option value="=">Знак =</option>
        <option value="—">Тире —</option>
        <option value=";">Точка с запятой</option>
        <option value=",">Запятая</option>
      </select>
      <span class="note" id="preview"></span>
    </div>
    <div class="bar">
      <button class="btn quiet" id="cancelImport">Отмена</button>
      <button class="btn solid" id="doImport">Добавить</button>
    </div>
    <div class="mini">
      <button class="btn quiet" id="copyAll">Скопировать все слова</button>
      <button class="btn quiet danger" id="wipe">Удалить всё</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
const KEY = "kartei.v1";
const BOXES = 5;
const DAYS = [0, 1, 3, 7, 21];      // интервал повторения для коробок 1..5
const DAY = 86400000;

let mem = null;                      // запасное хранилище, если localStorage закрыт
const store = {
  read(){
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return mem; }
  },
  write(v){
    mem = v;
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){}
  }
};

let state = store.read() || { cards: [] };
let queue = [];
let current = null;
let flipped = false;

const $ = id => document.getElementById(id);
const main = $("main");

/* ---------- данные ---------- */

function parse(text, sep){
  const out = [];
  for (const line of text.split(/\r?\n/)){
    const s = line.trim();
    if (!s) continue;
    let use = sep;
    if (sep === "auto"){
      use = s.includes("\t") ? "\t"
          : s.includes("=") ? "="
          : s.includes("—") ? "—"
          : s.includes(" - ") ? " - "
          : s.includes(";") ? ";"
          : s.includes(",") ? "," : null;
    }
    if (!use) continue;
    const i = s.indexOf(use);
    if (i < 1) continue;
    const front = s.slice(0, i).trim();
    let rest = s.slice(i + use.length).trim();
    let hint = "";
    const bar = rest.indexOf("|");
    if (bar > -1){ hint = rest.slice(bar + 1).trim(); rest = rest.slice(0, bar).trim(); }
    if (!front || !rest) continue;
    out.push({ front, back: rest, hint });
  }
  return out;
}

function addCards(list){
  const seen = new Set(state.cards.map(c => c.front.toLowerCase()));
  let added = 0;
  for (const c of list){
    if (seen.has(c.front.toLowerCase())) continue;
    seen.add(c.front.toLowerCase());
    state.cards.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
                       front: c.front, back: c.back, hint: c.hint, box: 1, due: 0 });
    added++;
  }
  store.write(state);
  return added;
}

function article(front){
  const m = /^(der|die|das)\b/i.exec(front.trim());
  return m ? m[1].toLowerCase() : "";
}

function due(){
  const now = Date.now();
  return state.cards.filter(c => (c.due || 0) <= now);
}

function buildQueue(all){
  const pool = all ? state.cards.slice() : due();
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  queue = pool;
  next();
}

function next(){
  flipped = false;
  current = queue.shift() || null;
  render();
}

function grade(known){
  if (!current) return;
  const card = state.cards.find(c => c.id === current.id);
  if (card){
    card.box = known ? Math.min(BOXES, card.box + 1) : 1;
    card.due = Date.now() + DAYS[card.box - 1] * DAY;
    if (!known) queue.push(card);          // забытое вернётся в этой же сессии
    store.write(state);
  }
  next();
}

/* ---------- отрисовка ---------- */

function renderKasten(){
  const k = $("kasten");
  k.innerHTML = "";
  const max = Math.max(1, ...[1,2,3,4,5].map(b => state.cards.filter(c => c.box === b).length));
  for (let b = 1; b <= BOXES; b++){
    const n = state.cards.filter(c => c.box === b).length;
    const el = document.createElement("div");
    el.className = "fach" + (current && current.box === b ? " active" : "");
    el.innerHTML = '<div class="fill" style="height:' + Math.round(n / max * 78) + '%"></div>' +
                   '<div class="lbl">' + b + '</div><div class="n">' + n + '</div>';
    k.appendChild(el);
  }
}

function renderCounts(){
  const total = state.cards.length;
  const d = due().length;
  $("counts").textContent = total ? d + " к повторению · " + total + " всего" : "";
}

function render(){
  renderCounts();
  renderKasten();

  if (!state.cards.length){
    main.innerHTML = '<div class="state"><h2>Пока пусто</h2>' +
      '<p>Вставьте список слов — приложение само разложит их по карточкам и будет возвращать забытые чаще.</p>' +
      '<button class="btn solid" id="firstAdd">Вставить список</button></div>';
    $("firstAdd").onclick = openSheet;
    return;
  }

  if (!current){
    main.innerHTML = '<div class="state"><h2>На сегодня всё</h2>' +
      '<p>Повторять пока нечего. Следующие карточки вернутся по расписанию — или пройдите всю колоду ещё раз.</p>' +
      '<button class="btn solid" id="again">Учить все</button></div>';
    $("again").onclick = () => buildQueue(true);
    return;
  }

  const art = article(current.front);
  const head = art
    ? '<span class="art">' + current.front.slice(0, art.length) + '</span>' + current.front.slice(art.length)
    : current.front;

  main.innerHTML =
    '<div class="card" id="card" data-art="' + art + '" tabindex="0" role="button" aria-label="Показать перевод">' +
      '<div class="term">' + head + '</div>' +
      (flipped ? '<div class="answer">' + esc(current.back) + '</div>' +
                 (current.hint ? '<div class="hint">' + esc(current.hint) + '</div>' : '')
               : '<div class="tap">НАЖМИТЕ, ЧТОБЫ ПРОВЕРИТЬ</div>') +
    '</div>' +
    '<div class="grade">' +
      '<button class="btn" id="bad" ' + (flipped ? "" : "disabled") + '>Не помню</button>' +
      '<button class="btn solid" id="good" ' + (flipped ? "" : "disabled") + '>Помню</button>' +
    '</div>';

  const card = $("card");
  card.onclick = flip;
  card.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
  if (flipped){ $("bad").onclick = () => grade(false); $("good").onclick = () => grade(true); }
}

function flip(){ if (!flipped){ flipped = true; render(); } }
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

/* ---------- лист вставки ---------- */

const sheet = $("sheet");
function openSheet(){ $("preview").textContent = ""; sheet.showModal(); }
$("openImport").onclick = openSheet;
$("cancelImport").onclick = () => sheet.close();
$("openAll").onclick = () => buildQueue(true);

$("paste").oninput = $("sep").onchange = () => {
  const n = parse($("paste").value, $("sep").value).length;
  $("preview").textContent = n ? n + " карточек" : "";
};

$("doImport").onclick = () => {
  const list = parse($("paste").value, $("sep").value);
  if (!list.length){
    $("preview").textContent = "Строки не разобрались — смените разделитель";
    return;
  }
  const added = addCards(list);
  $("paste").value = "";
  sheet.close();
  buildQueue(false);
  if (!current) buildQueue(true);
  $("counts").textContent = "добавлено: " + added;
  setTimeout(renderCounts, 2500);
};

$("copyAll").onclick = async () => {
  const text = state.cards.map(c => c.front + "\t" + c.back + (c.hint ? " | " + c.hint : "")).join("\n");
  try { await navigator.clipboard.writeText(text); $("preview").textContent = "скопировано"; }
  catch(e){ $("paste").value = text; $("preview").textContent = "скопируйте из поля вручную"; }
};

$("wipe").onclick = () => {
  if (!confirm("Удалить все карточки и прогресс?")) return;
  state = { cards: [] };
  store.write(state);
  queue = []; current = null;
  sheet.close();
  render();
};

/* ---------- старт ---------- */

buildQueue(false);
if (!current && state.cards.length) buildQueue(true);
render();

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
